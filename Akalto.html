<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Une question pour toi...</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ff758c 100%);
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      position: relative;
      padding: 20px;
    }

    /* Signature en haut à gauche */
    .signature {
      position: fixed;
      top: 18px;
      left: 22px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: #ffffff;
      background: rgba(255, 77, 109, 0.75);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(255, 77, 109, 0.25);
      z-index: 1000;
      letter-spacing: 0.5px;
    }

    /* Coeurs flottants en arrière-plan */
    .bg-hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .floating-heart {
      position: absolute;
      bottom: -50px;
      font-size: 24px;
      opacity: 0.6;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.7;
      }
      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Carte principale */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-radius: 30px;
      padding: 40px 30px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(214, 51, 108, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.8);
      transition: all 0.4s ease;
    }

    .emoji-header {
      font-size: 4.2rem;
      margin-bottom: 15px;
      display: inline-block;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.75rem;
      line-height: 1.4;
      color: #c9184a;
      margin-bottom: 30px;
      font-weight: 700;
    }

    .highlight-akalto {
      color: #ff4d6d;
      background: #fff0f3;
      padding: 2px 10px;
      border-radius: 12px;
      display: inline-block;
    }

    .buttons-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      min-height: 80px;
    }

    button {
      border: none;
      border-radius: 50px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    #yesBtn {
      background: linear-gradient(135deg, #ff4d6d, #ff758f);
      color: white;
      font-size: 1.25rem;
      padding: 15px 38px;
      box-shadow: 0 8px 25px rgba(255, 77, 109, 0.45);
      z-index: 20;
    }

    #yesBtn:hover {
      transform: scale(1.07);
      box-shadow: 0 12px 30px rgba(255, 77, 109, 0.6);
    }

    #noBtn {
      background: #f1f3f5;
      color: #495057;
      font-size: 1.1rem;
      padding: 14px 30px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
      z-index: 50;
    }

    #noBtn:hover {
      background: #e9ecef;
    }

    /* Écran de victoire */
    .success-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.6s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .success-screen h2 {
      font-family: 'Fredoka', sans-serif;
      font-size: 2rem;
      color: #c9184a;
      margin: 15px 0 10px;
    }

    .success-screen p {
      font-size: 1.15rem;
      color: #590d22;
      font-weight: 600;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- Signature en haut à gauche -->
  <div class="signature">by akalto</div>

  <!-- Coeurs en arrière-plan -->
  <div class="bg-hearts" id="bgHearts"></div>

  <!-- Carte interactive -->
  <div class="card">
    <div id="questionScreen">
      <div class="emoji-header" id="mainEmoji">🥺❤️</div>
      <h1>
        Tu es sûr tu veux pas être en cpl avec moi prsk jsuis sûr t la bonne
        <span class="highlight-akalto">(akalto)</span>
      </h1>
      <div class="buttons-container">
        <button id="yesBtn">Oui ❤️</button>
        <button id="noBtn">Non</button>
      </div>
    </div>

    <div id="successScreen" class="success-screen">
      <div class="emoji-header">🥰💖🎉</div>
      <h2>Meilleure décision de ta vie !</h2>
      <p>Je le savais que t'étais la bonne ❤️<br>Signé : akalto</p>
    </div>
  </div>

  <script>
    // Génération des coeurs flottants
    const bgHearts = document.getElementById('bgHearts');
    const heartSymbols = ['❤️', '💖', '💕', '💗', '💘'];

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('floating-heart');
      heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (Math.random() * 20 + 16) + 'px';
      heart.style.animationDuration = (Math.random() * 4 + 4) + 's';
      bgHearts.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 8000);
    }

    setInterval(createHeart, 450);

    // Logique des boutons Oui / Non
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const questionScreen = document.getElementById('questionScreen');
    const successScreen = document.getElementById('successScreen');
    const mainEmoji = document.getElementById('mainEmoji');

    const teasingMessages = [
      "T'es vraiment sûre ? 😳",
      "Réfléchis bien stp 🥺",
      "Allez dis oui ! ❤️",
      "Mauvais bouton ! 👀",
      "J'suis sûr t la bonne pourtant 💕",
      "Tu vas regretter 😭",
      "Clique sur le rose ! 👉",
      "Impossible de dire non 😌"
    ];

    let noClickCount = 0;
    let yesScale = 1;

    function moveNoButton() {
      // Changer le texte du bouton Non
      noBtn.innerText = teasingMessages[noClickCount % teasingMessages.length];
      noClickCount++;

      // Agrandir le bouton Oui progressivement
      yesScale += 0.18;
      yesBtn.style.transform = `scale(${Math.min(yesScale, 2.4)})`;

      // Changer l'émoji
      if (noClickCount === 2) mainEmoji.innerText = "😭💔";
      if (noClickCount === 4) mainEmoji.innerText = "🥹👉👈";
      if (noClickCount >= 6) mainEmoji.innerText = "😤❤️";

      // Déplacer le bouton Non aléatoirement dans l'écran
      noBtn.style.position = 'fixed';
      const padding = 20;
      const maxX = window.innerWidth - noBtn.offsetWidth - padding;
      const maxY = window.innerHeight - noBtn.offsetHeight - padding;

      const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
      const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

      noBtn.style.left = randomX + 'px';
      noBtn.style.top = randomY + 'px';
    }

    // Fuit au survol sur PC et au toucher sur mobile
    noBtn.addEventListener('mouseover', moveNoButton);
    noBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      moveNoButton();
    });
    noBtn.addEventListener('click', (e) => {
      e.preventDefault();
      moveNoButton();
    });

    // Action quand elle clique sur Oui
    yesBtn.addEventListener('click', () => {
      questionScreen.style.display = 'none';
      noBtn.style.display = 'none';
      successScreen.style.display = 'flex';

      // Explosion de confettis
      const duration = 3 * 1000;
      const end = Date.now() + duration;

      (function frame() {
        confetti({
          particleCount: 7,
          angle: 60,
          spread: 55,
          origin: { x: 0 },
          colors: ['#ff4d6d', '#ff758f', '#ffb3c1', '#ffffff']
        });
        confetti({
          particleCount: 7,
          angle: 120,
          spread: 55,
          origin: { x: 1 },
          colors: ['#ff4d6d', '#ff758f', '#ffb3c1', '#ffffff']
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      }());
    });
  </script>
</body>
</html>
